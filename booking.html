<!DOCTYPE html>
<html>
<head>
    <title>Book IPL Tickets</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h2>IPL 2026 Ticket Booking</h2>
        <a href="index.html">Home</a> | 
        <a href="booking.html">Book Ticket</a>
    </header>

    <section>
        <h2>IPL Ticket Booking Form</h2>

        <form action="#" method="get">
            <label><b>Full Name *</b></label>
            <input type="text" name="name" minlength="3" maxlength="30" placeholder="Minimum 3 letters" required>

            <label><b>Email Address *</b></label>
            <input type="email" name="email" placeholder="example@gmail.com" required>

            <label><b>Phone Number *</b></label>
            <input type="tel" name="phone" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" required>

            <label><b>Select Match *</b></label>
            <select name="match" required>
                <option value="">-- Choose Match --</option>
                <option value="rcb-csk">Match 01: RCB vs CSK (Bengaluru)</option>
                <option value="mi-kkr">Match 02: MI vs KKR (Mumbai)</option>
                <option value="csk-gt">Match 03: CSK vs GT (Chennai)</option>
            </select>

            <label><b>Stand Category *</b></label>
            <select name="stand" required>
                <option value="">-- Select Stand --</option>
                <option value="general">General (₹1,200)</option>
                <option value="premium">Premium (₹3,500)</option>
                <option value="vip">VIP (₹8,000)</option>
            </select>

            <label><b>Number of Tickets (1-6) *</b></label>
            <input type="number" name="tickets" min="1" max="6" value="1" required>

            <p style="margin: 15px 0 5px 0;"><b>Ticket Delivery Type:</b></p>
            <div>
                <input type="radio" id="eticket" name="delivery" value="eticket" checked>
                <label for="eticket">E-Ticket (Email / SMS)</label>
            </div>
            <div>
                <input type="radio" id="physical" name="delivery" value="physical">
                <label for="physical">Physical Ticket Delivery</label>
            </div>

            <p style="margin: 15px 0 5px 0;"><b>Add-ons:</b></p>
            <div>
                <input type="checkbox" id="cap" name="addons" value="cap">
                <label for="cap">Official Team Cap (₹499)</label>
            </div>
            <div>
                <input type="checkbox" id="parking" name="addons" value="parking">
                <label for="parking">Stadium Parking Pass (₹200)</label>
            </div>

            <br>
            <input type="submit" value="Submit & Book">
            <input type="reset" value="Reset Form">
        </form>
    </section>

    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

</body>
</html>
