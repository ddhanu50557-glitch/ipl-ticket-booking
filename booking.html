<!DOCTYPE html>
<html>
<head>
    <title>Book IPL Tickets</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h2>IPL 2026 Ticket Booking</h2>
        <a href="index.html">Home</a> | 
        <a href="booking.html">Book Ticket</a>
    </header>

    <hr>

    <section>
        <h2>IPL Ticket Booking Form</h2>

        <form action="#" method="get">
            <!-- Text Input with minlength -->
            <label>Full Name *</label><br>
            <input type="text" name="name" minlength="3" maxlength="30" placeholder="Minimum 3 letters" required>
            <br><br>

            <!-- Email Input -->
            <label>Email Address *</label><br>
            <input type="email" name="email" placeholder="example@gmail.com" required>
            <br><br>

            <!-- Phone Input with pattern -->
            <label>Phone Number *</label><br>
            <input type="tel" name="phone" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit number" required>
            <br><br>

            <!-- Match Select Dropdown -->
            <label>Select Match *</label><br>
            <select name="match" required>
                <option value="">-- Choose Match --</option>
                <option value="rcb-csk">Match 01: RCB vs CSK</option>
                <option value="mi-kkr">Match 02: MI vs KKR</option>
                <option value="csk-gt">Match 03: CSK vs GT</option>
            </select>
            <br><br>

            <!-- Stand Category Dropdown -->
            <label>Stand Category *</label><br>
            <select name="stand" required>
                <option value="">-- Select Stand --</option>
                <option value="general">General (₹1,200)</option>
                <option value="premium">Premium (₹3,500)</option>
                <option value="vip">VIP (₹8,000)</option>
            </select>
            <br><br>

            <!-- Number Input with min and max -->
            <label>Number of Tickets (1-6) *</label><br>
            <input type="number" name="tickets" min="1" max="6" value="1" required>
            <br><br>

            <!-- Radio Buttons -->
            <label>Ticket Delivery Type:</label><br>
            <input type="radio" id="eticket" name="delivery" value="eticket" checked>
            <label for="eticket">E-Ticket</label>
            <input type="radio" id="physical" name="delivery" value="physical">
            <label for="physical">Physical Ticket</label>
            <br><br>

            <!-- Checkboxes -->
            <label>Add-ons:</label><br>
            <input type="checkbox" id="cap" name="addons" value="cap">
            <label for="cap">Team Cap</label>
            <input type="checkbox" id="parking" name="addons" value="parking">
            <label for="parking">Parking Pass</label>
            <br><br>

            <!-- Submit and Reset Buttons -->
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>
    </section>

    <hr>

    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

</body>
</html>
